$('log').onclick=e=>{let b=e.target.closest('button[data-r]');if(!b||b.disabled||!H||H.end)return;let l=H.letters[b.dataset.r];if(!l||l.rp)return;l.rp=1;b.disabled=true;b.textContent='返信済み';L(`<small>返信</small> 「${RP[H.pers]}」`+chg({精神:1}),'lt')};
function deadlineDeath(){
  // 死亡期限は開始時に決定済み。既に存在する負傷・疾病・捕虜状態を優先し、存在しない病歴を後付けしない。
  if(H.sick){die('病気');return}
  if(H.wound){die('負傷後');return}
  if(H.pow){die('飢餓');return}
  if(H.ev&&active(H.ym).includes(H.ev)){die('戦闘');return}
  // 期限日にまだ生存している場合は、後方での移動・輸送中の事故として記録する。
  die('事故')
}
function endMonth(){ui.phase='turn';
 if(H.sp==1){if(H.hosp>0)H.hosp--;if(H.train>0)H.train--;H.served++;
  if(H.ev&&!H.hosp&&!H.pow){if(R.c(.3))chg({精神:-1});if(R.c(.2)&&(H.ym%12>9||H.ym%12<3))chg({健康:-1})}
  H.comp.forEach(c=>{if(c.s=='wounded'&&R.c(.4))c.s='ok'});famUpdate();
  let ok=H.fam.filter(m=>m.alive&&m.res!='occ');if(ok.length&&R.c(.6)&&!R.c(.1)){let m=R.p(ok);H.letters.push({f:m,at:H.ym+R.p([0,0,0,1,2])+(m.res=='sg'?1:0),w:R.i(1,4),dl:0,rp:0})}
  if(prog())return;if(H.pow&&R.c(.08)){H.pow=false;L('収容所を脱し、部隊に復帰した。')}
  if(H.ym>=H.deathAt){deadlineDeath();return}
  H.ym++;assign()}
 else for(let i=0;i<H.sp;i++){famUpdate();H.ym++}
 beginMonth()}
function famUpdate(){let t=H.ym,F=CFG.fam.value;H.fam.forEach(m=>{if(!m.alive)return;let s='home';if(H.rk=='west'&&t>=Y(1941,7)&&t<=Y(1944,7))s='occ';if(H.rk=='leningrad'&&t>=Y(1941,9)&&t<=Y(1944,1))s='sg';if(H.fe&&s!='home')s='evac';m.res=s;
 let p=s=='occ'?F.occ:s=='sg'?F.sg*(t>=Y(1941,12)&&t<=Y(1942,4)?2:1):s=='evac'?F.evac:F.base;if(R.c(p)){m.alive=false;m.rep=H.stg<3;if(H.stg<3)L(`${m.rel}が亡くなった。`+chg({精神:-3}),'x')}})}
function assign(){if(H.pow||H.hosp>0)return;let act=active(H.ym);if(H.ev&&act.includes(H.ev)&&!R.c(.06))return;H.ev=null;if(H.train>0||!act.length||R.c(.15))return;
 let e=R.w(act.map(x=>[x,x.d]));H.ev=e;H.jx=R.i(-4,4);H.jy=R.i(-4,4);H.loc=Math.max(1,Math.min(10,e.l+R.i(-1,1)));if(H.comp.filter(c=>c.s=='ok').length<3&&R.c(.5))H.comp.push(mkComp());
 L(`<b>${e.n}</b>の戦域に配置された。`);if(e.maj&&!H.seen[e.id]){H.seen[e.id]=1;H.battleCount++;Q.push({g:'戦',h:e.n,t:`${H.nm}の隊は${e.n}の戦域に入った。${e.t}`})}}
/* ===== 重大イベント（オーバーレイ） ===== */
function flush(){if(ui.phase==='ended'||!Q.length)return;let o=Q.shift();if(ui.phase!=='paused'){ui.prev=ui.phase;ui.phase='paused';clearInterval(ui.tm)}
 $('ovb').innerHTML=`<div class="g">${o.g}</div><h2>${o.h}</h2><p>${o.t}${o.d?chg(o.d):''}</p><button onclick="cls()">確認</button>`;$('ov').style.display='flex'}
function cls(){$('ov').style.display='none';if(ui.cl){ui.cl=0;return}if(Q.length){flush();return}ui.phase=ui.prev;if(ui.phase==='progress')startTick()}
/* ===== エンディング ===== */
function srcHtml(){return Object.keys(CFG).map(k=>{let c=CFG[k];return`・[${TL[c.type]}] ${typeof c.value=='string'?c.value+'：':''}${c.note}（${c.source}）`}).join('<br>')+'<br>・参考：1939年ソ連国勢調査／Krivosheev編のソ連軍人的損失統計／B. Schechter “The Stuff of Soldiers”／Feskovらによる赤軍編制研究。数値は原典で再確認が必要。'}
function ending(){clearInterval(ui.tm);ui.phase='ended';Q=[];ui.hold=false;$('pz').style.display='none';$('cs').style.display='none';$('ch').innerHTML='<small>記録は終了した。</small>';
 let E=H.end,al=H.fam.filter(m=>m.alive),dc=H.comp.filter(c=>c.s=='dead').length,nx=active(H.ym+1)[0],lt=H.letters.find(l=>!l.dl&&l.f.alive),ld=H.letters.filter(l=>l.dl).pop(),ev=Object.keys(H.seen).map(i=>W.find(x=>x.id==i).n);
 let ds=`${Math.floor(E.ym/12)}年${E.ym%12+1}月${E.d}日`;
 ui.pg=[`<div class="g">記</div><h2>① 死亡の記録</h2><div class="rc">氏名：${H.nm}<br>生年月日：${H.by}年${H.bm}月${H.bd}日<br>死亡年月日：${ds}<br>事前設定された死亡期限：${dstr(H.deathAt)}<br>死亡場所：${E.pl}<br>死亡原因：${E.cat}（${E.hw.replace(/、死亡した$|死亡した$/,'').replace(/により$/,'')}）<br>関係した兵器・装備：${E.wp||'なし'}${E.side?`（${E.side}）`:''}<br>最終階級・所属：${RK[H.rank]}・${H.br||'未配属'}</div><p>${E.txt}</p>`,
 `<h2>② 一人分の人生の記録</h2><p>${H.by}年${H.bm}月、${H.rn}に${H.eth}の子として生まれた。${H.edu}。性格は${H.pers}で、${H.job}として暮らした。家族は${H.fam.map(m=>m.rel).join('・')||'なし'}。${dstr(H.enl)}に召集され、${H.br}として従軍した。${ev.length?'加わった主な戦い：'+ev.join('、')+'。':''}個人戦果は敵兵${H.kills}、戦車・装甲車${H.tanks}、航空機${H.aircraft}。負傷${H.lw+H.hw}回${H.il?'、病気'+H.il+'回':''}${H.wp?'、捕虜の経験':''}。仲間のうち${dc}人が戦死した。</p>`,
 `<h2>③ 届かなかった手紙</h2><p>${lt?`死の後に、${lt.f.rel}からの手紙が出された。「${R.p(LT.n)}」。宛先の本人は、もういなかった。`:ld?`最後に届いた手紙は、${ld.f.rel}からのものだった。「${ld.tx}」`:al.length?`${al[0].rel}は手紙を書いた。「${R.p(LT.n)}」。それは本人には届かなかった。`:'手紙を待つ者は、もういなかった。'}</p>`,
 `<h2>④ 残された人々</h2><p>${al.length?al.map(m=>m.rel+'は'+(m.res=='occ'?'占領下で':m.res=='sg'?'包囲下で':m.res=='evac'?'避難先で':'')+'暮らしを続けた').join('。')+'。悲しみを抱えたまま、翌日も日常は続いた。':'故郷の家に、待つ者はもう残っていなかった。'}</p><p><small>${H.comp.map(c=>c.n+'（'+{ok:'隊に残った',wounded:'後送された',moved:'転属した',dead:'戦死した'}[c.s]+'）').join('、')}。その後の消息は、記録に残っていない。</small></p>`,
 `<h2>⑤ 世界は続く</h2><p>${dstr(H.ym+1)}。${nx?nx.t:'戦争は続いていた。'}${H.ym<Y(1945,5)?'ヨーロッパでの戦争が終わるのは、1945年5月のことである。':'戦争は終わりを迎えたが、各地の死者の記録はその後も続いた。'}</p>`,
 `<h2>⑥ 終わらない人数</h2><p>この記録は、数えきれない記録の一つにすぎない。${CFG.loss.value}（推定。出典は要再確認）。</p><div class="rc"><b>軍歴比較用の記録</b><br>戦果：敵兵 ${H.kills}／戦車・装甲車 ${H.tanks}／航空機 ${H.aircraft}<br>最終階級：${RK[H.rank]}<br>所属兵科：${H.br||'未配属'}<br>主な参加戦闘：${ev.join('、')||'記録なし'}<br><button onclick="shareRecord()">軍歴をコピー</button></div><button onclick="reviewLog()">ログで人生を振り返る</button><button onclick="start()">新しい主人公で始める</button><button onclick="title()">タイトルへ戻る</button><details><summary>出典と数値の区別</summary>${srcHtml()}</details>`];
 ui.es=0;endPage()}
function endPage(){if(ui.phase!=='ended')return;$('ovb').innerHTML=ui.pg[ui.es]+(ui.es<ui.pg.length-1?'<button onclick="nextPg()">次へ</button>':'');$('ov').style.display='flex'}

  let ev=Object.keys(H.seen).map(i=>W.find(x=>x.id==i).n);
  let txt=`${H.nm}／最終階級：${RK[H.rank]}／兵科：${H.br||'未配属'}
戦果：敵兵${H.kills}・戦車等${H.tanks}・航空機${H.aircraft}
参加した戦い：${ev.join('、')||'記録なし'}
死亡：${dstr(H.end.ym)} ${H.end.cat}`;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('軍歴をコピーしました。')).catch(()=>prompt('この記録をコピーしてください',txt))}else prompt('この記録をコピーしてください',txt)
}

function title(){clearInterval(ui.tm);ui={phase:'title',done:{},hold:false};H=null;Q=[];['ov','cs','pz'].forEach(i=>$(i).style.display='none');$('log').innerHTML=INTRO;$('ch').innerHTML=TB;$('dt').textContent='—';$('who').textContent='';$('loc').textContent='';$('st').innerHTML='';$('dot').setAttribute('cx',-9)}
